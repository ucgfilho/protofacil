services:
  web:
    image: nginx:alpine
    container_name: protofacil_web_proxy
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      target: deps
    container_name: protofacil_app
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:8000}
      VITE_PORT: "5174"
      VITE_URL: "http://localhost:5174"
      SESSION_SECRET: ${SESSION_SECRET:-desenvolvimento-altere-esta-chave}
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USERNAME:-protofacil}
      DB_USERNAME: ${DB_USERNAME:-protofacil}
      DB_NAME: ${DB_DATABASE:-protofacil}
      DB_DATABASE: ${DB_DATABASE:-protofacil}
      DB_PASSWORD: ${DB_PASSWORD:-protofacil}
    volumes:
      - ./:/app
      - protofacil_node_modules:/app/node_modules
    command: ["sh", "/app/.docker/bin/entrypoint.api.dev.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: protofacil_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-protofacil}
      MYSQL_USER: ${DB_USERNAME:-protofacil}
      MYSQL_PASSWORD: ${DB_PASSWORD:-protofacil}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - protofacil_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-protofacil}", "--password=${DB_PASSWORD:-protofacil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: protofacil_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  protofacil_db_data:
  protofacil_node_modules:
