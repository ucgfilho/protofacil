stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: "${HARBOR_HOST}/${HARBOR_PROJECT}/protofacil-app:${CI_COMMIT_SHORT_SHA}"
  WEB_IMAGE_TAG: "${HARBOR_HOST}/${HARBOR_PROJECT}/protofacil-web:${CI_COMMIT_SHORT_SHA}"

# ─── VALIDATE ────────────────────────────────────────────────────────────────
validate:
  stage: validate
  image: node:22-alpine
  tags:
    - staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci
    - npm run typecheck
    - npm run lint

# ─── BUILD STAGING ───────────────────────────────────────────────────────────
build:staging:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  tags:
    - staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      if [ -n "${HARBOR_HOST:-}" ] && [ -n "${HARBOR_USER:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
        echo "Fazendo login no registry Harbor..."
        echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USER" --password-stdin "$HARBOR_HOST"
        docker build --target prod -t "$IMAGE_TAG" .
        docker push "$IMAGE_TAG"
        docker build -f .docker/nginx/Dockerfile -t "$WEB_IMAGE_TAG" .
        docker push "$WEB_IMAGE_TAG"
      else
        echo "Registry não configurado ou inexistente. As imagens serão construídas localmente no deploy."
      fi

# ─── BUILD PRODUCTION ────────────────────────────────────────────────────────
build:production:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USER" --password-stdin "$HARBOR_HOST"
    - docker build --target prod -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    - docker build -f .docker/nginx/Dockerfile -t "$WEB_IMAGE_TAG" .
    - docker push "$WEB_IMAGE_TAG"
    - docker tag "$IMAGE_TAG" "${HARBOR_HOST}/${HARBOR_PROJECT}/protofacil-app:latest"
    - docker tag "$WEB_IMAGE_TAG" "${HARBOR_HOST}/${HARBOR_PROJECT}/protofacil-web:latest"
    - docker push "${HARBOR_HOST}/${HARBOR_PROJECT}/protofacil-app:latest"
    - docker push "${HARBOR_HOST}/${HARBOR_PROJECT}/protofacil-web:latest"

# ─── DEPLOY STAGING ──────────────────────────────────────────────────────────
deploy:staging:
  stage: deploy
  resource_group: staging
  tags:
    - staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - echo "Iniciando deploy no ambiente de staging..."
    - echo "Atualizando scripts de infraestrutura..."
    - cp compose.staging.yml "$STAGING_APP_PATH/compose.staging.yml"
    - cp .docker/bin/deploy.dev.sh "$STAGING_APP_PATH/.docker/bin/deploy.dev.sh"
    - chmod +x "$STAGING_APP_PATH/.docker/bin/deploy.dev.sh"
    - cd "$STAGING_APP_PATH"
    - COMPOSE_FILE=compose.staging.yml bash .docker/bin/deploy.dev.sh "${IMAGE_TAG:-}" "${HARBOR_USER:-}" "${HARBOR_PASSWORD:-}" "${HARBOR_HOST:-}" "${WEB_IMAGE_TAG:-}"

# ─── DEPLOY PRODUCTION ───────────────────────────────────────────────────────
deploy:production:
  stage: deploy
  image: python:3.12-alpine
  resource_group: production
  tags:
    - production
  needs:
    - build:production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - echo "Iniciando deploy no ambiente de Produção (Portainer via API)..."
    - apk add --no-cache bash curl
    - chmod +x .docker/bin/deploy.prod.sh
    - bash .docker/bin/deploy.prod.sh
